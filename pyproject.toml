[project]
name = "reyvin-api"
version = "0.1.0"
description = "Local AI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gitpython>=3.1.57",
    "ollama>=0.6.2",
    "pathspec>=1.1.1",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
